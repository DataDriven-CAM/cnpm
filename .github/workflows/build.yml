name: Build cnpm

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-13 cmake libssl-dev zlib1g-dev

    - name: Bootstrap and Build
      env:
        # Force the worker to build via g++-13 
        CC: gcc-13
        CXX: g++-13
      run: |
        # 1. Replicate directory architecture
        mkdir -p ~/.cnpm/cpp_modules
        mkdir -p cpp_modules
        
        # 2. Replicate bootstrap symlinking rules
        echo "Cloning and linking dependencies..."

        git clone https://github.com/onqtam/doctest.git ~/.cnpm/cpp_modules/doctest
        ln -sf ~/.cnpm/cpp_modules/doctest cpp_modules/doctest

        git clone https://github.com/rimmartin/urlcpp.git ~/.cnpm/cpp_modules/urlcpp
        ln -sf ~/.cnpm/cpp_modules/urlcpp cpp_modules/urlcpp
        
        git clone https://github.com/CLIUtils/CLI11.git ~/.cnpm/cpp_modules/CLI11
        ln -sf ~/.cnpm/cpp_modules/CLI11 cpp_modules/CLI11
        
        git clone https://github.com/madler/zlib.git ~/.cnpm/cpp_modules/zlib
        ln -sf ~/.cnpm/cpp_modules/zlib cpp_modules/zlib
        
        git clone https://github.com/DataDriven-CAM/json-thresher.git ~/.cnpm/cpp_modules/json-thresher
        ln -sf ~/.cnpm/cpp_modules/json-thresher cpp_modules/json-thresher
        
        git clone https://github.com/goblinhack/c-plus-plus-serializer.git ~/.cnpm/cpp_modules/c-plus-plus-serializer
        ln -sf ~/.cnpm/cpp_modules/c-plus-plus-serializer cpp_modules/c-plus-plus-serializer

        echo "Cloning stdexec concurrent execution framework..."
        git clone https://github.com/nvidia/stdexec.git ~/.cnpm/cpp_modules/stdexec
        ln -sf ~/.cnpm/cpp_modules/stdexec cpp_modules/stdexec

    - name: Debug Runner Directory Layout
      run: |
        echo "=== Current Workspace ===="
        pwd
        ls -la
        echo "=== Local cpp_modules Layout ==="
        ls -la cpp_modules/ || true
        echo "=== Global .cnpm User Layout ==="
        ls -la ~/.cnpm/cpp_modules/ || true
        echo "=== Searching for doctest.h structural locations ==="
        find ~/ -name "doctest.h" 2>/dev/null || true
                
        # 4. Compile modules sequentially
        echo "Building sub-modules..."
        export MODULE_DIRECTORY=../
        cd cpp_modules/urlcpp && make -f Makefile all && cd ../..
        
        cd cpp_modules/json-thresher
        mkdir -p cpp_modules
        git clone https://github.com cpp_modules/fmt
        export MODULE_DIRECTORY=../
        make -f Makefile all
        cd ../..
        
        # 5. Compile the main application
        echo "Compiling main cnpm binary layout..."
        make -j$(nproc)
